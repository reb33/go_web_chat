services: 
  liquibase:
    image: liquibase/liquibase:4.29
    volumes:
      - ./migrations/sql:/liquibase/lib/sql/
      - ./migrations/changelog.xml:/liquibase/lib/changelog.xml
    command: [ "update" ]
    environment:
      - LIQUIBASE_HEADLESS=true
      - LIQUIBASE_SHOW_BANNER=true
      - LIQUIBASE_DRIVER=org.postgresql.Driver
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog.xml
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgres:5432/webchat
      - LIQUIBASE_COMMAND_USERNAME=user
      - LIQUIBASE_COMMAND_PASSWORD=password
      - LIQUIBASE_LOG_LEVEL=FINE
      - LIQUIBASE_SCHEMA_NAME=liquibase
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webchat
    volumes:
      - ./tests/entrypoints/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:cached
    command: postgres -c shared_buffers=256MB -c max_connections=200
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "webchat"]
      interval: 1s
      timeout: 5s
      retries: 60